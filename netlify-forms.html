<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Netlify Forms — Milappli</title>
</head>
<body>
<!--
  Ce fichier n'est pas lié dans la navigation du site.
  Il existe uniquement pour que Netlify détecte le formulaire "contact"
  au moment du build, au cas où le formulaire de index.html serait un
  jour injecté en JS plutôt que rendu en HTML statique.
-->
<form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field">
  <input type="hidden" name="form-name" value="contact" />
  <p class="hidden"><label>Ne pas remplir : <input name="bot-field" /></label></p>
  <label for="contact-name">Nom</label>
  <input type="text" id="contact-name" name="name" required>
  <label for="contact-email">Email</label>
  <input type="email" id="contact-email" name="email" required>
  <label for="contact-message">Message</label>
  <textarea id="contact-message" name="message" rows="5" required></textarea>
  <button type="submit">Envoyer le message</button>
</form>
</body>
</html>
